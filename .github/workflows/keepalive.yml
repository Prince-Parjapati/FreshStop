name: Supabase keep-alive
# Free Supabase projects pause after ~7 days of inactivity; this pings the database every 3 days.
on: { schedule: [{ cron: '0 6 */3 * *' }], workflow_dispatch: {} }
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: curl -fsS --retry 3 "$URL/rest/v1/app_versions?select=version_code&limit=1" -H "apikey: $KEY"
