name: Supabase keep-alive

# Free Supabase projects pause after about 7 days of inactivity.
# This pings the database every 3 days to keep it awake.
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SB_URL: ${{ vars.VITE_SUPABASE_URL }}
          SB_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: curl -fsS --retry 3 "$SB_URL/rest/v1/app_versions?select=version_code&limit=1" -H "apikey: $SB_KEY"
